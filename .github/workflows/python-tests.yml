name: Python tests

on:
  push:
    paths:
      - "packet_tracer_ai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "packet_tracer_ai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
