! ======================================================
! Router R1 - Router-on-a-Stick + DHCP for VLAN 10/20/30
! Model: Cisco 2911 | Uplink: G0/0 to SW1 G0/1 (trunk)
! ======================================================
version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname R1
no ip domain-lookup
!
! Keep .1-.10 for statically assigned infrastructure
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
ip dhcp excluded-address 192.168.30.1 192.168.30.10
!
ip dhcp pool VLAN10_ADMIN
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8
!
ip dhcp pool VLAN20_IT
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 8.8.8.8
!
ip dhcp pool VLAN30_STUDENTS
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 8.8.8.8
!
interface GigabitEthernet0/0
 description TRUNK_TO_SW1_GIGABITETHERNET0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN10_ADMIN_GATEWAY
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description VLAN20_IT_GATEWAY
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
interface GigabitEthernet0/0.30
 description VLAN30_STUDENTS_GATEWAY
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
!
interface GigabitEthernet0/1
 no ip address
 shutdown
!
interface GigabitEthernet0/2
 no ip address
 shutdown
!
end
