! ======================================================
! Switch SW1 Configuration
! Role: VTP Server, EtherChannel 1 (LACP Active)
! Model: Cisco Catalyst 2960-24TT
! ======================================================

version 12.2
no service password-encryption
!
hostname SW1
!
no ip domain-lookup
!
! --- VTP Configuration ---
vtp domain CCNA
vtp password <SET_YOUR_VTP_PASSWORD>
vtp mode server
vtp version 2
!
! --- VLAN Definitions ---
vlan 10
 name ADMIN
!
vlan 20
 name IT
!
vlan 30
 name STUDENTS
!
! --- Port-Channel 1 (to SW2) ---
interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface FastEthernet0/23
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
interface FastEthernet0/24
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
! --- Uplink to R1 ---
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
! --- Access Interfaces ---
interface FastEthernet0/1
 description PC1 - VLAN 10 (ADMIN)
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC2 - VLAN 20 (IT)
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
 no shutdown
!
end
