! ======================================================
! SW1 - VTP SERVER | EtherChannel Po1 to SW2 | Uplink to R1
! Model: Cisco Catalyst 2960-24TT
! Assumed links: Fa0/23-24 to SW2 Fa0/23-24; G0/1 to R1 G0/0
! ======================================================
version 12.2
no service password-encryption
!
hostname SW1
no ip domain-lookup
spanning-tree mode rapid-pvst
!
! VTP settings must match SW2/SW3. Replace placeholder consistently.
vtp domain CCNA
vtp password <SET_YOUR_VTP_PASSWORD>
vtp mode server
vtp version 2
!
vlan 10
 name ADMIN
vlan 20
 name IT
vlan 30
 name STUDENTS
!
! EtherChannel 1 to SW2: both ends use LACP active
interface Port-channel1
 description LACP_TRUNK_TO_SW2
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface range FastEthernet0/23 - 24
 description LACP_MEMBER_TO_SW2
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
! Router-on-a-Stick trunk to R1 G0/0
interface GigabitEthernet0/1
 description TRUNK_TO_R1_G0/0
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface FastEthernet0/1
 description PC1_ADMIN_VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC2_IT_VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
end
