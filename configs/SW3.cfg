! ======================================================
! SW3 - VTP CLIENT | EtherChannel Po2 to SW2
! Model: Cisco Catalyst 2960-24TT
! Assumed links: Fa0/21-22 to SW2 Fa0/21-22
! ======================================================
version 12.2
no service password-encryption
!
hostname SW3
no ip domain-lookup
spanning-tree mode rapid-pvst
!
vtp domain CCNA
vtp password <SET_YOUR_VTP_PASSWORD>
vtp mode client
vtp version 2
!
! EtherChannel 2 to SW2: LACP active on both ends
interface Port-channel2
 description LACP_TRUNK_TO_SW2
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface range FastEthernet0/21 - 22
 description LACP_MEMBER_TO_SW2
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 2 mode active
 no shutdown
!
interface FastEthernet0/1
 description PC5_IT_VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC6_STUDENTS_VLAN30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
end
