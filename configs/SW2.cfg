! ======================================================
! Switch SW2 Configuration
! Role: VTP Client, EtherChannel 1 & 2 (LACP Active)
! Model: Cisco Catalyst 2960-24TT
! ======================================================

version 12.2
no service password-encryption
!
hostname SW2
!
no ip domain-lookup
!
! --- VTP Configuration ---
vtp domain CCNA
vtp password <SET_YOUR_VTP_PASSWORD>
vtp mode client
vtp version 2
!
! --- Port-Channel 1 (to SW1) ---
interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface FastEthernet0/23
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
interface FastEthernet0/24
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
! --- Port-Channel 2 (to SW3) ---
interface Port-channel2
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface FastEthernet0/21
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 2 mode active
 no shutdown
!
interface FastEthernet0/22
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 2 mode active
 no shutdown
!
! --- Access Interfaces ---
interface FastEthernet0/1
 description PC3 - VLAN 10 (ADMIN)
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC4 - VLAN 30 (STUDENTS)
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast
 no shutdown
!
end
