! ======================================================
! SW2 - VTP CLIENT | Po1 to SW1 | Po2 to SW3
! Model: Cisco Catalyst 2960-24TT
! Assumed links: Fa0/23-24 to SW1; Fa0/21-22 to SW3
! ======================================================
version 12.2
no service password-encryption
!
hostname SW2
no ip domain-lookup
spanning-tree mode rapid-pvst
!
vtp domain CCNA
vtp password <SET_YOUR_VTP_PASSWORD>
vtp mode client
vtp version 2
!
! EtherChannel 1 to SW1
interface Port-channel1
 description LACP_TRUNK_TO_SW1
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface range FastEthernet0/23 - 24
 description LACP_MEMBER_TO_SW1
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
! EtherChannel 2 to SW3
interface Port-channel2
 description LACP_TRUNK_TO_SW3
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
!
interface range FastEthernet0/21 - 22
 description LACP_MEMBER_TO_SW3
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30
 channel-protocol lacp
 channel-group 2 mode active
 no shutdown
!
interface FastEthernet0/1
 description PC3_ADMIN_VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC4_STUDENTS_VLAN30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
end
